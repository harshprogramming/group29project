<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Mood Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sign In</h1>
        <p>Welcome back to your Mood Tracker</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Sign In</button>
        </form>

        <p id="message"></p>

        <div class="link-text">
            Don't have an account? <a href="/register.html">Register</a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const payload = {
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            const messageEl = document.getElementById("message");
            messageEl.innerText = "";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = "/home.html";
                    return;
                }

                let errorMessage = result.message || "Login failed.";
                if (result.errors) {
                    errorMessage += "\n" + Object.values(result.errors).join("\n");
                }

                messageEl.innerText = errorMessage;
            } catch (error) {
                messageEl.innerText = "Could not connect to the backend.";
            }
        });
    </script>
</body>
</html>
