<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Mood Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="notifications-page">
        <div class="notification-icon-header">🔔</div>
        <h1>Notifications</h1>
        <p>
            Create reminder notifications for your mood and activity entries.
            Choose a time and write the message you want to see.
        </p>

        <div class="notification-panel">
            <h3 id="reminderFormTitle">Create Reminder</h3>

            <form id="reminderForm">
                <input type="hidden" id="editingReminderId" value="">

                <div class="form-group">
                    <label for="reminderTime">Reminder Time</label>
                    <input type="datetime-local" id="reminderTime" required>
                </div>

                <div class="form-group">
                    <label for="reminderMessage">Reminder Message</label>
                    <input
                        type="text"
                        id="reminderMessage"
                        maxlength="255"
                        placeholder="Example: Don’t forget to log your mood today"
                        required
                    >
                </div>

                <button type="submit" id="saveReminderBtn">Save Reminder</button>
                <button type="button" id="cancelEditBtn" style="display:none; margin-top:10px; background:#6b7280;">
                    Cancel Edit
                </button>
            </form>

            <p class="reminder-status" id="reminderStatus"></p>

            <div class="saved-reminders">
                <h4>Saved Reminders</h4>
                <div class="saved-reminder-list" id="savedReminderList">
                    <div class="saved-reminder-empty">No reminders saved.</div>
                </div>
            </div>
        </div>

        <div class="nav-buttons single-button">
            <a href="home.html">Back to Home</a>
        </div>
    </div>

    <script>
        const reminderForm = document.getElementById("reminderForm");
        const reminderTimeInput = document.getElementById("reminderTime");
        const reminderMessageInput = document.getElementById("reminderMessage");
        const reminderStatus = document.getElementById("reminderStatus");
        const saveReminderBtn = document.getElementById("saveReminderBtn");
        const savedReminderList = document.getElementById("savedReminderList");
        const editingReminderIdInput = document.getElementById("editingReminderId");
        const reminderFormTitle = document.getElementById("reminderFormTitle");
        const cancelEditBtn = document.getElementById("cancelEditBtn");

        function showReminderStatus(text, isError = false) {
            reminderStatus.textContent = text;
            reminderStatus.style.color = isError ? "#b91c1c" : "#166534";
        }

        function clearReminderStatus() {
            reminderStatus.textContent = "";
        }

        function formatReminderDateTime(value) {
            const date = new Date(value.replace(" ", "T"));
            return date.toLocaleString("en-US", {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
            });
        }

        function toDateTimeLocalValue(value) {
            const date = new Date(value.replace(" ", "T"));
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            const hours = String(date.getHours()).padStart(2, "0");
            const minutes = String(date.getMinutes()).padStart(2, "0");
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function resetReminderForm() {
            editingReminderIdInput.value = "";
            reminderFormTitle.textContent = "Create Reminder";
            saveReminderBtn.textContent = "Save Reminder";
            cancelEditBtn.style.display = "none";
            reminderForm.reset();
        }

        function startEditReminder(reminder) {
            editingReminderIdInput.value = reminder.reminder_id;
            reminderTimeInput.value = toDateTimeLocalValue(reminder.reminder_time);
            reminderMessageInput.value = reminder.reminder_message;
            reminderFormTitle.textContent = "Edit Reminder";
            saveReminderBtn.textContent = "Update Reminder";
            cancelEditBtn.style.display = "block";
            clearReminderStatus();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function loadSavedReminders() {
            try {
                const response = await fetch("/api/reminders");
                const result = await response.json();

                if (!result.success) {
                    savedReminderList.innerHTML = '<div class="saved-reminder-empty">Could not load reminders.</div>';
                    return;
                }

                const reminders = result.data.reminders || [];
                savedReminderList.innerHTML = "";

                if (!reminders.length) {
                    savedReminderList.innerHTML = '<div class="saved-reminder-empty">No reminders saved.</div>';
                    return;
                }

                reminders.forEach(reminder => {
                    const card = document.createElement("div");
                    card.className = "saved-reminder-card";

                    const actions = document.createElement("div");
                    actions.className = "saved-reminder-actions";

                    const editBtn = document.createElement("button");
                    editBtn.type = "button";
                    editBtn.className = "saved-reminder-btn edit";
                    editBtn.textContent = "Edit";
                    editBtn.addEventListener("click", () => startEditReminder(reminder));

                    const deleteBtn = document.createElement("button");
                    deleteBtn.type = "button";
                    deleteBtn.className = "saved-reminder-btn delete";
                    deleteBtn.textContent = "Delete";
                    deleteBtn.addEventListener("click", async () => {
                        const confirmed = confirm("Delete this reminder?");
                        if (!confirmed) return;

                        try {
                            const response = await fetch(`/api/reminders/${reminder.reminder_id}`, {
                                method: "DELETE",
                                headers: {
                                    "Content-Type": "application/json"
                                }
                            });

                            const result = await response.json();

                            if (result.success) {
                                showReminderStatus("Reminder deleted successfully.");
                                if (editingReminderIdInput.value === String(reminder.reminder_id)) {
                                    resetReminderForm();
                                }
                                loadSavedReminders();
                            } else {
                                showReminderStatus(result.message || "Failed to delete reminder.", true);
                            }
                        } catch (error) {
                            console.error(error);
                            showReminderStatus("Could not delete reminder.", true);
                        }
                    });

                    actions.appendChild(editBtn);
                    actions.appendChild(deleteBtn);

                    card.innerHTML = `
                        <div><strong>Time:</strong> ${formatReminderDateTime(reminder.reminder_time)}</div>
                        <div style="margin-top: 8px;"><strong>Message:</strong> ${reminder.reminder_message}</div>
                    `;
                    card.appendChild(actions);

                    savedReminderList.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                savedReminderList.innerHTML = '<div class="saved-reminder-empty">Could not load reminders.</div>';
            }
        }

        window.loadSavedReminders = loadSavedReminders;

        reminderForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            if (!("Notification" in window)) {
                showReminderStatus("This browser does not support notifications.", true);
                return;
            }

            if (Notification.permission !== "granted") {
                const permission = await Notification.requestPermission();

                if (permission !== "granted") {
                    showReminderStatus("Please allow notifications first.", true);
                    return;
                }
            }

            const payload = {
                reminder_time: reminderTimeInput.value.replace("T", " "),
                reminder_message: reminderMessageInput.value.trim()
            };

            if (!payload.reminder_time || !payload.reminder_message) {
                showReminderStatus("Please enter both time and message.", true);
                return;
            }

            const editingId = editingReminderIdInput.value;
            const isEditing = editingId !== "";
            const url = isEditing ? `/api/reminders/${editingId}` : "/api/reminders";
            const method = isEditing ? "PUT" : "POST";

            try {
                saveReminderBtn.disabled = true;
                cancelEditBtn.disabled = true;
                saveReminderBtn.textContent = isEditing ? "Updating..." : "Saving...";

                const response = await fetch(url, {
                    method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    showReminderStatus(isEditing ? "Reminder updated successfully." : "Reminder saved successfully.");
                    resetReminderForm();
                    loadSavedReminders();
                } else {
                    showReminderStatus(result.message || "Failed to save reminder.", true);
                }
            } catch (error) {
                console.error(error);
                showReminderStatus(isEditing ? "Could not update reminder." : "Could not save reminder.", true);
            } finally {
                saveReminderBtn.disabled = false;
                cancelEditBtn.disabled = false;
                saveReminderBtn.textContent = editingReminderIdInput.value ? "Update Reminder" : "Save Reminder";
            }
        });

        cancelEditBtn.addEventListener("click", function () {
            resetReminderForm();
            clearReminderStatus();
        });

        loadSavedReminders();
    </script>
    <script src="/reminders.js"></script>
</body>
</html>
