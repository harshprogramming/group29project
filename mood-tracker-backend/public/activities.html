<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activities - Mood Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Activity Entry</h1>
        <p>Log an activity that may help improve your mood and reduce stress.</p>

        <form id="activityForm" novalidate>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required />
            </div>

            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required />
            </div>

            <div class="form-group">
                <label for="activity">Activity</label>
                <select id="activity" name="activity_name" required>
                    <option value="">Select an activity</option>
                    <option value="Walking">Walking</option>
                    <option value="Jogging">Jogging</option>
                    <option value="Meditation">Meditation</option>
                    <option value="Yoga">Yoga</option>
                    <option value="Reading">Reading</option>
                    <option value="Listening to Music">Listening to Music</option>
                    <option value="Journaling">Journaling</option>
                    <option value="Stretching">Stretching</option>
                    <option value="Deep Breathing">Deep Breathing</option>
                    <option value="Talking to a Friend">Talking to a Friend</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="">Select a category</option>
                    <option value="Physical">Physical</option>
                    <option value="Mindfulness">Mindfulness</option>
                    <option value="Relaxation">Relaxation</option>
                    <option value="Social">Social</option>
                    <option value="Creative">Creative</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" name="duration_minutes" min="1" max="300" placeholder="Example: 20" />
            </div>

            <div class="form-group">
                <label for="effortLevel">Effort Level</label>
                <select id="effortLevel" name="effort_level">
                    <option value="">Select effort level</option>
                    <option value="1">1 - Very Light</option>
                    <option value="2">2 - Light</option>
                    <option value="3">3 - Moderate</option>
                    <option value="4">4 - High</option>
                    <option value="5">5 - Very High</option>
                </select>
            </div>

            <div class="form-group">
                <label for="activityNote">Notes</label>
                <textarea
                    id="activityNote"
                    name="note"
                    rows="4"
                    maxlength="500"
                    placeholder="Write a few details about the activity..."
                ></textarea>
            </div>

            <button type="submit" id="saveActivityBtn">Save Activity</button>
        </form>

        <p id="message" aria-live="polite"></p>

        <div class="link-text">
            <a href="/home.html">Back to Home</a>
        </div>
    </div>

    <script src="/activities.js"></script>
    <script src="/reminders.js"></script>
</body>
</html>
